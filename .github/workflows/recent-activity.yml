name: Update README with Recent Commits

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test README updater
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Fetch and update commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_recent_activity.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README unchanged"
            exit 0
          fi
          git commit -m "Update README with recent commits"
          git push
